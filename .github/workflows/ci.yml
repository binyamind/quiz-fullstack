name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  NODE_VERSION: '22'

jobs:
  verify:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: concentrate-quiz
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/concentrate-quiz
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-secret-at-least-32-characters-long

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Lint
        run: npx eslint apps/api/src apps/web/src

      - name: Typecheck
        run: npm run typecheck

      - name: Test with coverage
        # Coverage thresholds live in vitest.config.ts; the run fails below them.
        run: npm run coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  docker:
    name: Build and push image
    runs-on: ubuntu-latest
    needs: verify
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Publishing needs credentials this repository may not have. Without them
      # the image is still built on every run to prove it compiles; only the
      # push is skipped, so a missing secret cannot fail the pipeline.
      - name: Resolve whether this run can publish
        id: publish
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] \
            && [ "${{ github.ref }}" = 'refs/heads/main' ] \
            && [ "${{ github.event_name }}" = 'push' ]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Docker Hub credentials absent - building without publishing.'
          fi

      - name: Log in to Docker Hub
        if: steps.publish.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push api image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: api
          push: ${{ steps.publish.outputs.enabled == 'true' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME || 'local' }}/concentrate-quiz-api:latest
            ${{ secrets.DOCKERHUB_USERNAME || 'local' }}/concentrate-quiz-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: web
          push: ${{ steps.publish.outputs.enabled == 'true' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME || 'local' }}/concentrate-quiz-web:latest
            ${{ secrets.DOCKERHUB_USERNAME || 'local' }}/concentrate-quiz-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  e2e:
    name: Playwright journeys
    runs-on: ubuntu-latest
    needs: verify
    env:
      JWT_SECRET: ci-secret-at-least-32-characters-long
      COOKIE_SECURE: 'false'
      SEED_PASSWORD: password-1234
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Start stack
        run: docker compose up -d --wait --build

      - name: Seed demo school
        run: npm run seed:demo
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/concentrate-quiz
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci-secret-at-least-32-characters-long

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Run journeys
        run: npm run e2e
        env:
          E2E_BASE_URL: http://localhost:3000

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
